# MPC Tape Echo - native skin, "Rack" redesign (2026-10-27).
#
# Look: the PulyTek-inspired anodised panel language from the MPC DJ FX 2 port - engraved letterspaced
# caps, hairline bays with a rule under the title, warm amber LEDs, cream option tiles, one real VU,
# bat-lever switches. Adapted to the tape echo: a warmer graphite (machine chassis, not synth), an oxide
# rust second accent for the tape path, and the instrument's own identity drawn as panel engraving - the
# three play heads with their tape ribbon (TAPE page) and the spring tank (TONE page).
#
# Artwork: vst/art/make_te_skin.py (panels, engravings, tiles, switches) + vst/art/make_vu.py (the live
# VU filmstrip). MPC draws every parameter name and value live on top; nothing live is baked.
#
# THREE pages, one Q-Link bank each (a tab with 9+ Q-Links would open MPC's own sub-page navigation):
#   PROGRAM  record VU, mix, VU-cal trimmer, the 12 head/reverb modes, tempo sync + time/division
#   TAPE     repeat rate, head feedback, echo + spring output, wow/flutter, tape wear and tape age,
#            with the three-head transport engraved beside them
#   TONE     bass / treble / tone tilt, input drive, stereo width, input-arm and ping-pong switches,
#            with the spring tank engraved beside them
#
# Coordinates are the framework's shadow space: SCREEN Y = cy - 86 (the plugin area is y 86..714).
#   screen 96..600 = the bays, 0..92 = masthead, 604..628 = footer rule.
#
# 2-state parameters (tempo_sync, input_send, ping_pong) are `toggle` lines and stay OFF every qlinks
# line: a 2-entry option list flips on any Q-Link event, and MPC's Q-Link pickup re-sends a stale value
# when another knob in the bank turns, so the switch would jump back on its own. tape_age (3 states) and
# the vu meter are off the banks for the same reason - the tiles are the control.
theme_bg=22201c
theme_panel=151412
theme_line=3f3b35
theme_ink=d3c9b4
theme_ink_dim=f0e8d4
theme_ink_faint=8c8578
theme_accent=e2a64a
theme_accent_hi=f6c570
theme_knob_face=141311
theme_knob_ring=0a0908
theme_knob_dot=f0e8d4
theme_lcd=0d0c0a
theme_seg_active=e8dfc8
theme_seg_inactive=1d1b17
theme_seg_active_tx=17150f
theme_display_ink=f0e8d4
theme_box=0b0a08
knob_look=hardware
scale_names=1
label_scale=1.0
art_css=skin.css

# ================================================================ PROGRAM
[tab PROGRAM]
art file=bg_program.png fit=cover
frame x=24  y=182 w=340 h=504 title="PROGRAM / MIX"
frame x=384 y=182 w=520 h=504 title="MODE  ·  HEAD + TANK"
frame x=924 y=182 w=332 h=504 title="SYNC / DIV"

# -- the one real meter: the engine's record VU (24 steps, HAS_DISPLAY_REV) inside a machined window,
#    with the program mix and the 8-step VU-cal trimmer under it.
text    cx=194  cy=236  label="RECORD LEVEL" size=0.95 color=8c8578 align=center spacing=2.6 case=upper
meter   cx=194  cy=314  w=304 h=132 key=vu strip=art/vu_strip.png frames=24
knob    cx=124  cy=456  r=40 label="MIX"    key=mix    ns=19 vs=28 bw=160
knob    cx=272  cy=456  r=30 label="VU CAL" key=vu_cal ns=16 vs=20 bw=130
text    cx=124  cy=581  label="DRY / WET"    size=0.85 color=8c8578 align=center spacing=1.8 case=upper
text    cx=272  cy=581  label="METER TRIM"   size=0.85 color=8c8578 align=center spacing=1.8 case=upper

# -- the twelve head / spring combinations as a bank of machined tiles, with the live meaning of the
#    selected one underneath (per-mode text panels, the confirmed `when=` path for text).
text    cx=644  cy=236  label="TWELVE COMBINATIONS · TAP A TILE" size=0.9 color=8c8578 align=center spacing=2.2 case=upper
enum_h  cx=644  cy=276  label="" key=mode sw=148 sh=62 rows=4 img=art/seg_mode_off.png img_on=art/seg_mode_on.png
text    cx=644  cy=548  label="HEAD 1" size=1.7 color=f0e8d4 align=center when=mode:H1
text    cx=644  cy=548  label="HEAD 2" size=1.7 color=f0e8d4 align=center when=mode:H2
text    cx=644  cy=548  label="HEAD 3" size=1.7 color=f0e8d4 align=center when=mode:H3
text    cx=644  cy=548  label="HEADS 2+3" size=1.7 color=f0e8d4 align=center when=mode:H2+3
text    cx=644  cy=548  label="HEAD 1 + SPRING" size=1.7 color=f0e8d4 align=center when=mode:H1+R
text    cx=644  cy=548  label="HEAD 2 + SPRING" size=1.7 color=f0e8d4 align=center when=mode:H2+R
text    cx=644  cy=548  label="HEAD 3 + SPRING" size=1.7 color=f0e8d4 align=center when=mode:H3+R
text    cx=644  cy=548  label="HEADS 1+2 + SPRING" size=1.7 color=f0e8d4 align=center when=mode:H12+R
text    cx=644  cy=548  label="HEADS 2+3 + SPRING" size=1.7 color=f0e8d4 align=center when=mode:H23+R
text    cx=644  cy=548  label="HEADS 1+3 + SPRING" size=1.7 color=f0e8d4 align=center when=mode:H13+R
text    cx=644  cy=548  label="ALL THREE HEADS + SPRING" size=1.7 color=f0e8d4 align=center when=mode:H123R
text    cx=644  cy=548  label="SPRING TANK ONLY" size=1.7 color=f0e8d4 align=center when=mode:Rev
text    cx=644  cy=578  label="H = PLAY HEAD    ·    R = SPRING TANK" size=0.85 color=8c8578 align=center spacing=1.8 case=upper

# -- tempo sync and the echo time. DIV is the engine's physical 11-detent sync control (same delay as
#    TIME, as a detent); which note each detent means follows the leading play head, so the ring is
#    engraved with ticks only and the live value prints the note (dynamic_display).
toggle  cx=1002 cy=256  label="" key=tempo_sync img=art/switch_off.png img_on=art/switch_on.png w=40 h=58 ns=0
text    cx=1024 cy=256  label="TEMPO SYNC" size=1.0 color=b9b1a0 align=left spacing=1.8 case=upper
knob    cx=1090 cy=386  r=48 label="TIME" key=time_ms ns=21 vs=34 bw=180
# interface switch: the three skins ship with the plugin; the pick lands on the next insert
text    cx=1090 cy=452  label="INTERFACE" size=0.95 color=8c8578 align=center spacing=2.6 case=upper
enum_h  cx=1090 cy=490  label="" key=ui sw=88 sh=28 rows=1
knob    cx=1090 cy=591  r=28 label="DIV"  key=echo_rate_note ns=17 vs=22 bw=150
qlinks "PROGRAM" = mix,vu_cal,mode,time_ms,echo_rate_note

# ================================================================ TAPE
[tab TAPE]
art file=bg_tape.png fit=cover
frame x=24  y=182 w=800 h=504 title="TAPE  ·  RATE / FEEDBACK / LEVELS / WEAR"
frame x=844 y=182 w=412 h=504 title="TAPE TRANSPORT"

# -- row 1: motor speed and the two output levels
knob    cx=176  cy=316  r=46 label="RATE"     key=repeat_rate  ns=20 vs=30 bw=200
knob    cx=424  cy=316  r=46 label="FEEDBACK" key=intensity    ns=20 vs=30 bw=200
knob    cx=672  cy=316  r=46 label="ECHO"     key=echo_volume  ns=20 vs=30 bw=200

# -- row 2: the spring return and the two tape-condition controls
knob    cx=176  cy=486  r=46 label="VERB"  key=reverb_volume ns=20 vs=30 bw=200
knob    cx=424  cy=486  r=46 label="W&F"   key=wow_flutter   ns=20 vs=30 bw=200
knob    cx=672  cy=486  r=46 label="WEAR"  key=tape_wear     ns=20 vs=30 bw=200

# -- tape stock: three tiles, tap targets full knob width
text    cx=424  cy=619  label="TAPE STOCK" size=0.85 color=8c8578 align=center spacing=1.8 case=upper
enum_h  cx=424  cy=656  label="" key=tape_age sw=200 sh=48 rows=1 img=art/seg_age_off.png img_on=art/seg_age_on.png
qlinks "TAPE" = repeat_rate,intensity,echo_volume,reverb_volume,wow_flutter,tape_wear

# ================================================================ TONE
[tab TONE]
art file=bg_tone.png fit=cover
frame x=24  y=182 w=660 h=504 title="TONE  ·  EQ / INPUT / SPACE"
frame x=704 y=182 w=552 h=504 title="SPRING TANK"

# -- the two EQ bands and the tilt (TILT is a balance, not a second lowpass: treble follows it and
#    bass counter-moves at a shallower slope)
knob    cx=134  cy=316  r=44 label="BASS"   key=bass         ns=20 vs=30 bw=200
knob    cx=354  cy=316  r=44 label="TREBLE" key=treble       ns=20 vs=30 bw=200
knob    cx=574  cy=316  r=44 label="TILT"   key=tone_tilt    ns=20 vs=30 bw=200

# -- input trim and the stereo spread
knob    cx=234  cy=486  r=44 label="DRIVE" key=input_volume ns=20 vs=30 bw=200
knob    cx=474  cy=486  r=44 label="WIDTH" key=stereo_width ns=20 vs=30 bw=200

# -- the two program switches, off every Q-Link bank
toggle  cx=234  cy=631  label="" key=input_send img=art/switch_off.png img_on=art/switch_on.png w=40 h=58 ns=0
text    cx=258  cy=631  label="INPUT ARM" size=1.0 color=b9b1a0 align=left spacing=1.8 case=upper
toggle  cx=474  cy=631  label="" key=ping_pong img=art/switch_off.png img_on=art/switch_on.png w=40 h=58 ns=0
text    cx=498  cy=631  label="PING-PONG" size=1.0 color=b9b1a0 align=left spacing=1.8 case=upper
qlinks "TONE" = bass,treble,tone_tilt,input_volume,stereo_width
