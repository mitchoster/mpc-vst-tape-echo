# MPC Tape Echo - Studio-style skin (browser artwork). Tabs: TAPE / SYNC - OUT.
#
# Composition, both tabs: header strip (product, page tag, SYNC and PONG switches), one display
# panel that carries the tape-echo state -- big engraved mode name (12 live `text when=mode:` lines),
# the real VU window with its printed scale, the delay-time read-out, and a transport window with the
# three heads and the spring tank -- then a row of FOUR parameter cards, 310 px wide (y 366..614 in
# art pixels). Plates, panel, transport and card frames are baked by vst/art/make_plate.py; the knob
# filmstrip by vst/art/make_widgets.py, the VU by vst/art/make_vu.py; vst/skin.css restyles the few
# controls the renderer draws itself (option tiles).
#
# Coordinates are DEVICE pixels: the plugin area is y 86..714. The art (vst/bg_*.png, 1280x628) is the
# same page with y shifted by -86, so every cy here is the art y + 86 -- see vst/art/look.py (Y_OFF).
# An enum_h is CENTRED on its cy (seg_rects in shadow_skin.py); rows= stacks extra rows downwards.
#
# Card grid (art -> device is +86; these cx values are device x, cards are 8 px apart from x=8):
#   card 1 x  8..318  centre 163
#   card 2 x 326..636 centre 481
#   card 3 x 644..954 centre 799
#   card 4 x 962..1272 centre 1117
# Knob rows sit on cy=598 (art 512), enum rows start at cy=500 (art 414), card hints at art 442.
theme_bg=0a0c0f
theme_panel=13171c
theme_line=2b323b
theme_ink=e9ecf0
theme_ink_dim=8f98a2
theme_ink_faint=5c646e
theme_accent=e0a33a
theme_accent_hi=e8b45a
theme_knob_face=22262c
theme_knob_ring=2e343c
theme_knob_dot=e0a33a
theme_lcd=0b0e11
theme_seg_active=e0a33a
theme_seg_inactive=1d2228
theme_seg_active_tx=15181c
theme_box=0b0e11
theme_btn_bg=2a1216
theme_btn_on=e0a33a
theme_btn_text=f2c9cc
knob_strip=art/knob_strip.png
knob_frames=127
art_css=skin.css

# ---------------------------------------------------------------- Tab 1 - TAPE (the machine)
[tab TAPE]
art file=bg_tape.png fit=cover
# header: the two 2-state switches live here, on both pages, and stay OFF the Q-Link banks (a 2-entry
# option list flips on any Q-Link event and the pickup re-sends a stale value when another knob turns)
enum_h cx=1000 cy=115 sw=56 key=tempo_sync
enum_h cx=1180 cy=115 sw=56 key=ping_pong
# display panel: the selected mode as a big engraved label + its one-line meaning (12 when= lines;
# `text when=` is the verified live path on this port since 2026-10-14)
text cx=30 cy=206 label="HEAD 1" size=3.2 color=e9ecf0 align=left weight=600 spacing=1.6 case=upper when=mode:H1
text cx=30 cy=206 label="HEAD 2" size=3.2 color=e9ecf0 align=left weight=600 spacing=1.6 case=upper when=mode:H2
text cx=30 cy=206 label="HEAD 3" size=3.2 color=e9ecf0 align=left weight=600 spacing=1.6 case=upper when=mode:H3
text cx=30 cy=206 label="HEADS 2 + 3" size=3.2 color=e9ecf0 align=left weight=600 spacing=1.6 case=upper when=mode:H2+3
text cx=30 cy=206 label="HEAD 1 + SPRING" size=3.2 color=e9ecf0 align=left weight=600 spacing=1.6 case=upper when=mode:H1+R
text cx=30 cy=206 label="HEAD 2 + SPRING" size=3.2 color=e9ecf0 align=left weight=600 spacing=1.6 case=upper when=mode:H2+R
text cx=30 cy=206 label="HEAD 3 + SPRING" size=3.2 color=e9ecf0 align=left weight=600 spacing=1.6 case=upper when=mode:H3+R
text cx=30 cy=206 label="HEADS 1+2 + SPRING" size=3.2 color=e9ecf0 align=left weight=600 spacing=1.6 case=upper when=mode:H12+R
text cx=30 cy=206 label="HEADS 2+3 + SPRING" size=3.2 color=e9ecf0 align=left weight=600 spacing=1.6 case=upper when=mode:H23+R
text cx=30 cy=206 label="HEADS 1+3 + SPRING" size=3.2 color=e9ecf0 align=left weight=600 spacing=1.6 case=upper when=mode:H13+R
text cx=30 cy=206 label="ALL 3 + SPRING" size=3.2 color=e9ecf0 align=left weight=600 spacing=1.6 case=upper when=mode:H123R
text cx=30 cy=206 label="SPRING ONLY" size=3.2 color=e9ecf0 align=left weight=600 spacing=1.6 case=upper when=mode:Rev
text cx=30 cy=258 label="ONE HEAD ONLY" size=1.25 color=8f98a2 align=left weight=600 spacing=0.9 case=upper when=mode:H1
text cx=30 cy=258 label="ONE HEAD ONLY" size=1.25 color=8f98a2 align=left weight=600 spacing=0.9 case=upper when=mode:H2
text cx=30 cy=258 label="ONE HEAD ONLY" size=1.25 color=8f98a2 align=left weight=600 spacing=0.9 case=upper when=mode:H3
text cx=30 cy=258 label="TWO HEADS TOGETHER" size=1.25 color=8f98a2 align=left weight=600 spacing=0.9 case=upper when=mode:H2+3
text cx=30 cy=258 label="ONE HEAD + SPRING TANK" size=1.25 color=8f98a2 align=left weight=600 spacing=0.9 case=upper when=mode:H1+R
text cx=30 cy=258 label="ONE HEAD + SPRING TANK" size=1.25 color=8f98a2 align=left weight=600 spacing=0.9 case=upper when=mode:H2+R
text cx=30 cy=258 label="ONE HEAD + SPRING TANK" size=1.25 color=8f98a2 align=left weight=600 spacing=0.9 case=upper when=mode:H3+R
text cx=30 cy=258 label="TWO HEADS + SPRING TANK" size=1.25 color=8f98a2 align=left weight=600 spacing=0.9 case=upper when=mode:H12+R
text cx=30 cy=258 label="TWO HEADS + SPRING TANK" size=1.25 color=8f98a2 align=left weight=600 spacing=0.9 case=upper when=mode:H23+R
text cx=30 cy=258 label="TWO HEADS + SPRING TANK" size=1.25 color=8f98a2 align=left weight=600 spacing=0.9 case=upper when=mode:H13+R
text cx=30 cy=258 label="THREE HEADS + SPRING TANK" size=1.25 color=8f98a2 align=left weight=600 spacing=0.9 case=upper when=mode:H123R
text cx=30 cy=258 label="THE TANK ALONE - NO HEADS" size=1.25 color=8f98a2 align=left weight=600 spacing=0.9 case=upper when=mode:Rev
# the real VU: engine-driven step -> 24-frame filmstrip inside the baked trough (display-only meter,
# redrawn live under HAS_DISPLAY_REV + DISPLAY_REV_NO_UPDATE, verified on this port)
meter cx=760 cy=247 w=464 h=46 key=vu strip=art/vu_strip.png frames=24
# delay time: ms normally, the note while SYNC is on (time_ms carries dynamic_display in the module)
readout cx=1140 cy=204 w=212 h=56 label="" key=time_ms tsize=30 tcolor=e0a33a talign=center
# card 1 - MODE / HEADS (the 12-way selector; touch-only in reading order, see the Q-Link note below)
enum_h cx=163 cy=510 sw=68 sh=48 rows=3 key=mode
# card 2 - TAPE (AGE is 3-way, the four knobs are the tape's motion)
enum_h cx=481 cy=500 sw=76 sh=30 key=tape_age
knob cx=379 cy=598 r=22 bw=64 ns=12 vs=16 label="RATE" key=repeat_rate
knob cx=447 cy=598 r=22 bw=64 ns=12 vs=16 label="FBK" key=intensity
knob cx=515 cy=598 r=22 bw=64 ns=12 vs=16 label="W&F" key=wow_flutter
knob cx=583 cy=598 r=22 bw=64 ns=12 vs=16 label="WEAR" key=tape_wear
# card 3 - TONE (three knobs, centred on their card)
knob cx=731 cy=598 r=22 bw=64 ns=12 vs=16 label="BASS" key=bass
knob cx=799 cy=598 r=22 bw=64 ns=12 vs=16 label="TREBLE" key=treble
knob cx=867 cy=598 r=22 bw=64 ns=12 vs=16 label="TILT" key=tone_tilt
# card 4 - ECHO / VERB (the two return levels; MIX lives on the OUT page)
knob cx=1083 cy=598 r=22 bw=64 ns=12 vs=16 label="ECHO" key=echo_volume
knob cx=1151 cy=598 r=22 bw=64 ns=12 vs=16 label="VERB" key=reverb_volume
# the interface switch sits in this card's free enum row (same y as every other card's enum row)
enum_h cx=1117 cy=500 sw=68 sh=30 rows=1 key=ui
# Q-Link 1-4 = TAPE (RATE, FBK, W&F, WEAR), 5-7 = TONE (BASS, TREBLE, TILT),
# 8-9 = ECHO / VERB (ECHO, VERB), 10 = MODE (the card-1 selector), 11 = TAPE AGE (card-2 enum),
# 12 = TIME (the panel's delay read-out: it has no knob on this page, but the tape time is the one
# value worth a physical knob everywhere -- this is the same param the SYNC page's TIME knob drives).
# The two option-list entries come AFTER the card knobs on purpose: check_qlinks.py (and MPC's own
# page order) read the bank as knobs first, and a 12-way selector in slot 1 would look like a bank
# that starts with a switch. Both are continuous-ish (stepped) controls, so they earn a slot;
# SYNC and PONG are 2-state and stay in the header, off the bank.
qlinks "TAPE" = repeat_rate,intensity,wow_flutter,tape_wear,bass,treble,tone_tilt,echo_volume,reverb_volume,mode,tape_age,time_ms

# ---------------------------------------------------------------- Tab 2 - SYNC / OUT (timing + output)
[tab SYNC OUT]
art file=bg_sync.png fit=cover
enum_h cx=1000 cy=115 sw=56 key=tempo_sync
enum_h cx=1180 cy=115 sw=56 key=ping_pong
# the panel is the same machine display on every page (mode, VU, delay, transport)
text cx=30 cy=206 label="HEAD 1" size=3.2 color=e9ecf0 align=left weight=600 spacing=1.6 case=upper when=mode:H1
text cx=30 cy=206 label="HEAD 2" size=3.2 color=e9ecf0 align=left weight=600 spacing=1.6 case=upper when=mode:H2
text cx=30 cy=206 label="HEAD 3" size=3.2 color=e9ecf0 align=left weight=600 spacing=1.6 case=upper when=mode:H3
text cx=30 cy=206 label="HEADS 2 + 3" size=3.2 color=e9ecf0 align=left weight=600 spacing=1.6 case=upper when=mode:H2+3
text cx=30 cy=206 label="HEAD 1 + SPRING" size=3.2 color=e9ecf0 align=left weight=600 spacing=1.6 case=upper when=mode:H1+R
text cx=30 cy=206 label="HEAD 2 + SPRING" size=3.2 color=e9ecf0 align=left weight=600 spacing=1.6 case=upper when=mode:H2+R
text cx=30 cy=206 label="HEAD 3 + SPRING" size=3.2 color=e9ecf0 align=left weight=600 spacing=1.6 case=upper when=mode:H3+R
text cx=30 cy=206 label="HEADS 1+2 + SPRING" size=3.2 color=e9ecf0 align=left weight=600 spacing=1.6 case=upper when=mode:H12+R
text cx=30 cy=206 label="HEADS 2+3 + SPRING" size=3.2 color=e9ecf0 align=left weight=600 spacing=1.6 case=upper when=mode:H23+R
text cx=30 cy=206 label="HEADS 1+3 + SPRING" size=3.2 color=e9ecf0 align=left weight=600 spacing=1.6 case=upper when=mode:H13+R
text cx=30 cy=206 label="ALL 3 + SPRING" size=3.2 color=e9ecf0 align=left weight=600 spacing=1.6 case=upper when=mode:H123R
text cx=30 cy=206 label="SPRING ONLY" size=3.2 color=e9ecf0 align=left weight=600 spacing=1.6 case=upper when=mode:Rev
text cx=30 cy=258 label="ONE HEAD ONLY" size=1.25 color=8f98a2 align=left weight=600 spacing=0.9 case=upper when=mode:H1
text cx=30 cy=258 label="ONE HEAD ONLY" size=1.25 color=8f98a2 align=left weight=600 spacing=0.9 case=upper when=mode:H2
text cx=30 cy=258 label="ONE HEAD ONLY" size=1.25 color=8f98a2 align=left weight=600 spacing=0.9 case=upper when=mode:H3
text cx=30 cy=258 label="TWO HEADS TOGETHER" size=1.25 color=8f98a2 align=left weight=600 spacing=0.9 case=upper when=mode:H2+3
text cx=30 cy=258 label="ONE HEAD + SPRING TANK" size=1.25 color=8f98a2 align=left weight=600 spacing=0.9 case=upper when=mode:H1+R
text cx=30 cy=258 label="ONE HEAD + SPRING TANK" size=1.25 color=8f98a2 align=left weight=600 spacing=0.9 case=upper when=mode:H2+R
text cx=30 cy=258 label="ONE HEAD + SPRING TANK" size=1.25 color=8f98a2 align=left weight=600 spacing=0.9 case=upper when=mode:H3+R
text cx=30 cy=258 label="TWO HEADS + SPRING TANK" size=1.25 color=8f98a2 align=left weight=600 spacing=0.9 case=upper when=mode:H12+R
text cx=30 cy=258 label="TWO HEADS + SPRING TANK" size=1.25 color=8f98a2 align=left weight=600 spacing=0.9 case=upper when=mode:H23+R
text cx=30 cy=258 label="TWO HEADS + SPRING TANK" size=1.25 color=8f98a2 align=left weight=600 spacing=0.9 case=upper when=mode:H13+R
text cx=30 cy=258 label="THREE HEADS + SPRING TANK" size=1.25 color=8f98a2 align=left weight=600 spacing=0.9 case=upper when=mode:H123R
text cx=30 cy=258 label="THE TANK ALONE - NO HEADS" size=1.25 color=8f98a2 align=left weight=600 spacing=0.9 case=upper when=mode:Rev
meter cx=760 cy=247 w=464 h=46 key=vu strip=art/vu_strip.png frames=24
readout cx=1140 cy=204 w=212 h=56 label="" key=time_ms tsize=30 tcolor=e0a33a talign=center
# card 1 - SYNC / TIME (DIV is the sync detent, TIME is the tape speed in ms; the header switch decides)
knob cx=129 cy=598 r=22 bw=64 ns=12 vs=16 label="DIV" key=echo_rate_note
knob cx=197 cy=598 r=22 bw=64 ns=12 vs=16 label="TIME" key=time_ms
# card 2 - INPUT (ARM is 2-state, so it is touch-only and off the bank)
enum_h cx=481 cy=500 sw=64 sh=30 key=input_send
knob cx=481 cy=598 r=22 bw=64 ns=12 vs=16 label="DRIVE" key=input_volume
# card 3 - OUTPUT (MIX + WIDTH are continuous; PONG is a 2-state switch in the header)
knob cx=765 cy=598 r=22 bw=64 ns=12 vs=16 label="MIX" key=mix
knob cx=833 cy=598 r=22 bw=64 ns=12 vs=16 label="WIDTH" key=stereo_width
# card 4 - VU CAL (8-way trim, 4 x 2 tiles; only scales the meter, never the audio)
enum_h cx=1117 cy=500 sw=68 sh=30 rows=2 key=vu_cal
# Q-Link 1-2 = SYNC / TIME (DIV, TIME), 3 = INPUT (DRIVE), 4-5 = OUTPUT (MIX, WIDTH),
# 6 = VU CAL (the 8-way trim; stepped, not a 2-state switch, so it can sit on the bank).
# ARM, SYNC and PONG are 2-state switches and stay off the bank (header / touch-only tiles).
qlinks "SYNC OUT" = echo_rate_note,time_ms,input_volume,mix,stereo_width,vu_cal
