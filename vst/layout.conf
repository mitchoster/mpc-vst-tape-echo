# MPC Tape Echo - native MPC skin (spec section 14). Engine: Dusk Audio Tape Echo 2 via
# the Schwung audio_fx module (see ../src/VENDORED.md). Built by the framework tooling
# (shadow_skin / shadow_art). Render every page with:
#   tools/studio.py preview "<skin>/Plugin Skins" -o docs/ui-preview/page_%d.png
# First pass: geometry + all 19 params + the 12-mode selector and mode descriptions.
# The RE-201 faceplate artwork (art file= / html renderer) is spec task 9, not here yet.

# RE-202-inspired dark chassis: charcoal body, white knob pointers, red accent
# (an homage, not a clone; the engine has no shadow page to copy). HTML renderer.
theme_bg=24252a
theme_panel=1b1c20
theme_line=3a3c42
theme_ink=f0f0ee
theme_ink_dim=9a9ca2
theme_ink_faint=5c5e64
theme_accent=c8102e
theme_accent_hi=e2344b
theme_knob_face=131417
theme_knob_ring=050607
theme_knob_dot=f2f2f0
theme_lcd=0c0d10
theme_seg_active=c8102e
theme_seg_inactive=1a1b1f
theme_seg_active_tx=f6f6f4
toggle_look=led
scale_names=1
label_scale=1.35

# Backgrounds: bg.png carries the recessed VU window, so it is used only on MAIN,
# where the live `meter key=vu` sits. TAPE and OUT use bg_plain.png (same plate, no
# empty window) -- else the recessed hole shows up empty on tabs without the meter.
# Both are generated by vst/art/make_faceplate.py (--no-vu-window writes the plain one).

# ---------------------------------------------------------------- Page 1 - MAIN
[tab MAIN]
art file=bg.png fit=cover
text cx=640 cy=196 label="MPC TAPE ECHO" size=2.2 color=e2344b
knob cx=110 cy=336 r=46 label="TIME" key=time_ms
enum_h cx=300 cy=336 label="SYNC" key=tempo_sync sw=90
knob cx=490 cy=336 r=46 label="FBK" key=intensity
knob cx=680 cy=336 r=46 label="MIX" key=mix
knob cx=110 cy=556 r=46 label="TONE" key=tone_tilt
knob cx=300 cy=556 r=46 label="WID" key=stereo_width
knob cx=490 cy=556 r=46 label="TAPE" key=tape_wear
enum_h cx=1030 cy=386 label="MODE" key=mode sw=72 rows=2
# what the selected mode does (mode panels; one line shown at a time)
text cx=1030 cy=496 label="HEAD 1" size=1.4 color=9a8f7a when=mode:H1
text cx=1030 cy=496 label="HEAD 2" size=1.4 color=9a8f7a when=mode:H2
text cx=1030 cy=496 label="HEAD 3" size=1.4 color=9a8f7a when=mode:H3
text cx=1030 cy=496 label="HEADS 2+3" size=1.4 color=9a8f7a when=mode:H2+3
text cx=1030 cy=496 label="HEAD 1 + SPRING" size=1.4 color=9a8f7a when=mode:H1+R
text cx=1030 cy=496 label="HEAD 2 + SPRING" size=1.4 color=9a8f7a when=mode:H2+R
text cx=1030 cy=496 label="HEAD 3 + SPRING" size=1.4 color=9a8f7a when=mode:H3+R
text cx=1030 cy=496 label="HEADS 1+2 + SPRING" size=1.4 color=9a8f7a when=mode:H12+R
text cx=1030 cy=496 label="HEADS 2+3 + SPRING" size=1.4 color=9a8f7a when=mode:H23+R
text cx=1030 cy=496 label="HEADS 1+3 + SPRING" size=1.4 color=9a8f7a when=mode:H13+R
text cx=1030 cy=496 label="ALL HEADS + SPRING" size=1.4 color=9a8f7a when=mode:H123R
text cx=1030 cy=496 label="SPRING REVERB ONLY" size=1.4 color=9a8f7a when=mode:Rev
# live VU: engine-driven step -> filmstrip frame, in the faceplate's window. A display-only `meter`
# (filmstrip Knob) is the widget docs/SKIN_STUDIO.md marks verified-live: MPC repaints it when the
# wrapper reports the value (HAS_DISPLAY_REV + DISPLAY_REV_NO_UPDATE). (A `picture` of one `art when=`
# per step also moves under HAS_DISPLAY_REV, but the meter is the confirmed live path.)
meter cx=1048 cy=596 w=304 h=40 key=vu strip=art/vu_strip.png frames=24
text cx=1030 cy=554 label="VU" size=1.3 color=9a8f7a
# The 2-state toggles (SYNC/ARM/PONG) are deliberately NOT on Q-Links: a short range races under a
# Q-Link (any event flips it) and the Q-Link pickup re-sends a stale value when another knob turns,
# so SYNC appeared to jump back on its own. They stay plain GUI toggles, which is what a 2-state
# switch wants anyway. TIME shows the sync division (dynamic_display) instead of ms while SYNC is on.
# Q-Link order = the on-screen layout: top row TIME/FBK/MIX/MODE (Q1-4), bottom row TONE/WID/TAPE (Q5-7).
qlinks "MAIN" = time_ms,intensity,mix,mode,tone_tilt,stereo_width,tape_wear

# ---------------------------------------------------------------- Page 2 - TAPE / INPUT
[tab TAPE]
art file=bg_plain.png fit=cover
text cx=640 cy=196 label="TAPE / INPUT" size=2.2 color=e2344b
enum_h cx=128 cy=336 label="ARM" key=input_send sw=90
knob cx=384 cy=336 r=46 label="DRIVE" key=input_volume
enum_v cx=640 cy=346 label="AGE" key=tape_age sw=220
knob cx=896 cy=336 r=46 label="W&F" key=wow_flutter
knob cx=128 cy=556 r=46 label="BASS" key=bass
knob cx=384 cy=556 r=46 label="TREBLE" key=treble
knob cx=640 cy=556 r=46 label="RATE" key=repeat_rate
qlinks "TAPE" = input_volume,tape_age,wow_flutter,bass,treble,repeat_rate

# ---------------------------------------------------------------- Page 3 - OUTPUT
[tab OUT]
art file=bg_plain.png fit=cover
text cx=640 cy=196 label="OUTPUT" size=2.2 color=e2344b
# No DIV knob: `echo_rate_note` is the same detent TIME picks under Sync, so it was a duplicate
# (and inert with Sync off). The division is driven from TIME on MAIN.
knob cx=320 cy=356 r=46 label="ECHO" key=echo_volume
knob cx=640 cy=356 r=46 label="VERB" key=reverb_volume
enum_h cx=960 cy=356 label="PONG" key=ping_pong sw=90
knob cx=320 cy=540 r=36 label="VU CAL" key=vu_cal
text cx=640 cy=646 label="MODE / RATE / WOW-FLUTTER ON MAIN AND TAPE" size=1.2 color=9a8f7a
qlinks "OUT" = echo_volume,reverb_volume
